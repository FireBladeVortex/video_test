name: 버그 제보
description: 오류를 제보합니다
title: "[버그] "
labels: ["bug"]
type: Bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 어떤 문제가 생겼나요?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 브라우저
      options:
        - Chrome
        - Edge
        - Firefox
