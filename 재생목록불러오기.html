<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>재생목록 비교</title>
	<style>
		* { margin : 0; padding : 0; border : 0; box-sizing : border-box; }

		:root
		{
			--오른쪽바탕색 : #021322;
			--왼쪽바탕색 : #230213;
			--강조1 : #FFD700;
			--강조2 : #800020;
		}

		body
		{
			display : flex;
			width : 100vw;
			height : 100dvh;
			overflow : hidden;
			background : var(--오른쪽바탕색);
			color : var(--강조1);
			font-size : 14px;
		}

		#왼쪽
		{
			flex : 0 0 50%;
			min-width : 0;
			height : 100%;
			background : var(--왼쪽바탕색);
			display : flex;
			flex-direction : column;
			align-items : center;
			justify-content : center;
			gap : 12px;
		}

		#오른쪽
		{
			position : relative;
			flex : 1;
			min-width : 0;
			height : 100%;
			display : flex;
			flex-direction : column;
			align-items : center;
		}

		.줄
		{
			display : flex;
			width : 80%;
			gap : 6px;
		}

		.줄 input,
		.줄 select
		{
			flex : 1;
			min-width : 0;
			padding : 6px;
		}

		.줄 button,
		#복사하기
		{
			padding : 6px 12px;
			cursor : pointer;
			background : var(--강조2);
			color : var(--강조1);
		}

		#상태
		{
			width : 80%;
			text-align : left;
		}

		#오른쪽 h1
		{
			width : 100%;
			display : flex;
			justify-content : center;
			padding : 10px 0;
			border-bottom : 3px solid var(--강조2);
		}

		#결과
		{
			width : 90%;
			flex : 1;
			overflow : auto;
			padding : 10px 0;
			white-space : pre-wrap;
			word-break : break-all;
		}

		#api_숨김
		{
			position : fixed;
			left : -9999px;
			width : 200px;
			height : 200px;
		}
	</style>
</head>

<body>
	<div id="왼쪽">
		<div class="줄">
			<input id="주소_입력" type="text" placeholder="재생목록 주소">
			<button id="불러오기">불러오기</button>
		</div>
		<div class="줄">
			<select id="이름_선택"></select>
			<select id="종류_선택">
				<option value="원곡">원곡</option>
				<option value="커버">커버</option>
				<option value="쇼츠">쇼츠</option>
			</select>
			<button id="비교하기">비교하기</button>
		</div>
		<div id="상태"></div>
	</div>

	<div id="오른쪽">
		<h1><button id="복사하기">복사하기</button></h1>
		<div id="결과"></div>
	</div>

	<div id="api_숨김"><div id="YTP"></div></div>
</body>

<script src="nw/준비.js"></script>
<script src="nw/도구.js"></script>
</html>
